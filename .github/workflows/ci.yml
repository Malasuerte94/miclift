name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.94.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: windows-rust-1.94.1-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Static analysis (including gated driver setup)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: DSP, resampling and configuration tests
        run: cargo test --locked --all-targets
      - name: Build release
        run: cargo build --locked --release --bins
      - name: Headless smoke checks
        shell: pwsh
        run: |
          & target/release/miclift-diagnostics.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed' }
          $p = Start-Process target/release/miclift.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'App smoke check failed' }
      - name: Package installer and portable archive
        shell: pwsh
        run: |
          ./tools/generate-notices.ps1
          ./tools/package.ps1
      - name: Installer smoke test (no audio driver)
        shell: pwsh
        run: ./tools/test-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miclift-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
