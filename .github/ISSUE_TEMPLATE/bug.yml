name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: MicLift version and Windows build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Audio devices and formats
      description: Include USB/AUX/dongle/Bluetooth, sample rates and whether Live Listen is enabled. Do not upload personal audio.
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics JSON
      description: Remove device IDs or other information you do not want to share.
